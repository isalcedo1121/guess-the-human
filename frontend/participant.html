<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#5634b9">
    <title>Your answer · Guess the Human</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/participant.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Guess the Human home"><span class="mark" aria-hidden="true">?</span> GUESS THE HUMAN</a>
    </header>
    <main id="main">
      <div class="hero"><h1>Your <em>answer!</em></h1></div>
      <section class="card narrow" aria-label="Anonymous answer form">
        <div id="participant-question-card" class="question-card first" hidden><p class="overline">Question</p><p id="participant-question" class="question"></p></div>
        <form id="answer-form" hidden>
          <label class="field-label" for="submission">Your answer</label>
          <textarea class="text-entry" id="submission" name="answer" minlength="2" maxlength="280"
            placeholder="Type your answer…" aria-describedby="answer-note char-count" required></textarea>
          <p id="answer-note" class="field-note">Keep it anonymous. Leave out names and personal details.</p>
          <div class="actions">
            <span class="char-count" id="char-count"><span id="character-total">0</span> / 280</span>
            <button class="btn primary" id="submit-answer" type="submit">Submit →</button>
          </div>
        </form>
        <p id="submission-error" class="field-note error-message" role="alert" hidden></p>
        <p id="participant-message" class="field-note" role="status" hidden></p>
        <div id="submission-confirmation" class="reveal good" role="status" hidden><p class="actual">Answer submitted.</p></div>
      </section>
    </main>
  </body>
</html>
